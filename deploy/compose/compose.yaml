name: thermora
x-app: &app
  image: thermora:local
  build: { context: ../.., dockerfile: deploy/compose/Dockerfile }
  user: "${THERMORA_UID:?Run task provision}:${THERMORA_GID:?Run task provision}"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  init: true
  restart: unless-stopped
services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: thermora
      POSTGRES_DB: thermora
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../../.local/postgres-password:/run/secrets/postgres-password:ro
    networks: [backend]
    healthcheck:
      {
        test: [CMD-SHELL, "pg_isready -U thermora -d thermora"],
        interval: 2s,
        timeout: 2s,
        retries: 30,
      }
    restart: unless-stopped
  mqtt:
    image: eclipse-mosquitto:2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
    user: "${THERMORA_UID}:${THERMORA_GID}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ../../.local/mqtt:/mosquitto/data
      - ../../.local/pki/ca.pem:/run/pki/ca.pem:ro
      - ../../.local/pki/mqtt.pem:/run/pki/mqtt.pem:ro
      - ../../.local/pki/mqtt.key:/run/pki/mqtt.key:ro
    networks: [uplink]
    restart: unless-stopped
  migrate:
    <<: *app
    command: [cloud, -migrate]
    restart: "no"
    volumes:
      - ../../.local/migrate.json:/run/cloud.json:ro
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
  cloud:
    <<: *app
    command: [cloud]
    volumes:
      - ../../.local/cloud.json:/run/cloud.json:ro
      - ../../.local/seed.json:/run/seed.json:ro
      - ../../.local/devices:/run/devices:ro
      - ../../.local/pki/ca.pem:/run/pki/ca.pem:ro
      - ../../.local/pki/cloud.pem:/run/pki/cloud.pem:ro
      - ../../.local/pki/cloud.key:/run/pki/cloud.key:ro
    ports: ["127.0.0.1:8443:8443"]
    networks: [backend, uplink]
    depends_on:
      migrate: { condition: service_completed_successfully }
      mqtt: { condition: service_started }
    healthcheck:
      { test: [CMD, thermora, health], interval: 5s, timeout: 4s, retries: 20 }
  sim:
    <<: *app
    command: [sim]
    volumes: ["../../.local/sim-state:/state"]
    networks: [equipment]
  edge:
    <<: *app
    command: [edge]
    volumes:
      - ../../.local/edge.json:/run/edge.json:ro
      - ../../.local/pki/ca.pem:/run/pki/ca.pem:ro
      - ../../.local/edge-state:/state
    networks: [equipment, uplink]
    depends_on:
      cloud: { condition: service_healthy }
      sim: { condition: service_started }
networks:
  backend: { internal: true }
  equipment: { internal: true }
  uplink: {}
volumes:
  postgres-data: {}
