openapi: 3.1.0
info:
  title: Thermora API
  version: 1.0.0
  description: |
    Local simulation API for onboarding, ownership, telemetry, control, run history and fleet operations.
    Sign in through the Thermora dashboard or POST /api/v1/session before using
    protected operations. The browser sends the HttpOnly session cookie automatically;
    entering a cookie in Swagger UI's Authorize dialog cannot set it.
    Writes affect the running local system. A command response means an intention
    was persisted, not that equipment has applied it; inspect command evidence and telemetry.
servers:
  - url: /
tags:
  - name: Cloud onboarding
    description: Local accounts, simulated manufacturer authorization, partner entitlement and consent.
  - name: Session
    description: Browser sign-in and the current user's organizations.
  - name: Buildings
    description: Ownership, comfort preferences, and device claims.
  - name: Devices
    description: Telemetry, control intentions, and execution evidence.
  - name: Edge
    description: Device activation with a provisioned bootstrap credential, independent of user sessions.
  - name: Health
    description: Public process and dependency probes.
security:
  - session: []
paths:
  /api/v1/accounts:
    post:
      operationId: registerAccount
      tags: [Cloud onboarding]
      summary: Create a local owner account; no organization access is granted yet
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [login, password]
              properties:
                login: { type: string, minLength: 3, maxLength: 254 }
                password:
                  {
                    type: string,
                    format: password,
                    minLength: 12,
                    maxLength: 256,
                  }
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/manufacturers:
    get:
      operationId: listManufacturers
      tags: [Cloud onboarding]
      summary: List configured integrations; real manufacturers are not enabled
      responses:
        "200":
          description: Available local integrations
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, prerequisites, simulated]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    prerequisites: { type: string }
                    simulated: { type: boolean }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/manufacturer-authorizations:
    post:
      operationId: authorizeManufacturer
      tags: [Cloud onboarding]
      summary: Start a browser-bound, one-use OAuth authorization with PKCE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [manufacturer_id]
              properties:
                manufacturer_id: { type: string, enum: [demo] }
      responses:
        "201":
          description: Navigate the browser to this provider URL; tokens never enter the browser
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url, expires_at_wall]
                properties:
                  authorization_url: { type: string, format: uri }
                  expires_at_wall: { type: string, format: date-time }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/manufacturer-authorizations/callback:
    get:
      operationId: manufacturerCallback
      tags: [Cloud onboarding]
      summary: Provider redirect; requires the initiating browser's one-use state cookie
      security: []
      parameters:
        - {
            name: state,
            in: query,
            required: true,
            schema: { type: string, maxLength: 128 },
          }
        - { name: code, in: query, schema: { type: string, maxLength: 256 } }
        - { name: error, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        "303":
          description: Return to local onboarding with an opaque connection ID or safe error code
          headers:
            Location: { required: true, schema: { type: string } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/manufacturer-connections:
    get:
      operationId: listManufacturerConnections
      tags: [Cloud onboarding]
      summary: Resume the signed-in user's manufacturer connections
      responses:
        "200":
          description: Connections without credentials
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ManufacturerConnection" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/manufacturer-connections/{connection_id}/devices:
    parameters:
      - {
          name: connection_id,
          in: path,
          required: true,
          schema: { $ref: "#/components/schemas/ID" },
        }
    get:
      operationId: discoverManufacturerDevices
      tags: [Cloud onboarding]
      summary: Discover authorized mock equipment; refresh expiring tokens server-side
      responses:
        "200":
          description: Only explicitly mapped demo inventory can be added
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, available]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    available: { type: boolean }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/cloud-enrollments:
    post:
      operationId: completeCloudEnrollment
      tags: [Cloud onboarding]
      summary: Atomically redeem a partner invitation, create a building, record consent and claim selected equipment
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudEnrollment" }
      responses:
        "201":
          description: Building created; equipment activation and telemetry remain asynchronous
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Building" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/buildings/{building_id}/profile:
    parameters:
      - {
          name: building_id,
          in: path,
          required: true,
          schema: { $ref: "#/components/schemas/ID" },
        }
    get:
      operationId: getBuildingProfile
      tags: [Cloud onboarding]
      summary: Read the cloud onboarding building and tariff details
      responses:
        "200":
          description: Building profile; absent for legacy claim-only enrollment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildingProfile" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateBuildingProfile
      tags: [Buildings]
      summary: Edit the building name and profile; fence plans affected by tariff changes
      parameters:
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string, pattern: '^"[0-9]+"$' },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, profile]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                profile: { $ref: "#/components/schemas/BuildingProfile" }
      responses:
        "200":
          description: Updated building
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Building" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/buildings/{building_id}/manufacturer-enrollments:
    parameters:
      - {
          name: building_id,
          in: path,
          required: true,
          schema: { $ref: "#/components/schemas/ID" },
        }
    post:
      operationId: attachManufacturerDevice
      tags: [Buildings]
      summary: Attach authorized manufacturer equipment to an existing building and independent zone
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  connection_id,
                  manufacturer_device_id,
                  zone_name,
                  consent_accepted,
                ]
              properties:
                connection_id: { $ref: "#/components/schemas/ID" }
                manufacturer_device_id:
                  { type: string, minLength: 1, maxLength: 100 }
                zone_name: { type: string, minLength: 1, maxLength: 100 }
                consent_accepted: { type: boolean }
      responses:
        "201":
          description: Equipment claimed for the building; activation is asynchronous
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{device_id}/connection:
    parameters: [{ $ref: "#/components/parameters/DeviceID" }]
    delete:
      operationId: disconnectDevice
      tags: [Devices]
      summary: Disconnect manufacturer control or retire a direct-edge identity; retain history
      responses:
        "204":
          {
            description: Consent withdrawn; offline physical fallback depends on lease expiry,
          }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: reconnectDevice
      tags: [Devices]
      summary: Restore explicit device consent using an authorized manufacturer connection for the same owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [connection_id, consent_accepted]
              properties:
                connection_id: { $ref: "#/components/schemas/ID" }
                consent_accepted: { type: boolean }
      responses:
        "202":
          {
            description: Consent restored; fresh configuration and telemetry are still required,
          }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/manufacturer-connections/{connection_id}:
    parameters:
      - {
          name: connection_id,
          in: path,
          required: true,
          schema: { $ref: "#/components/schemas/ID" },
        }
    delete:
      operationId: disconnectManufacturer
      tags: [Cloud onboarding]
      summary: Revoke the signed-in user's connection and withdraw consent for all attached equipment
      responses:
        "204": { description: Connection revoked and local credentials cleared }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/session:
    post:
      operationId: login
      tags: [Session]
      summary: Sign in and set the browser session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [login, password]
              properties:
                login: { type: string, minLength: 1, maxLength: 254 }
                password:
                  {
                    type: string,
                    format: password,
                    minLength: 1,
                    maxLength: 256,
                  }
      responses:
        "200":
          {
            description: Signed in,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Session" } },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
    get:
      operationId: getSession
      tags: [Session]
      summary: Read the current session
      responses:
        "200":
          {
            description: Session,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Session" } },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: logout
      tags: [Session]
      summary: Sign out and revoke the current session
      responses:
        "204": { description: Signed out }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/organizations:
    get:
      operationId: listOrganizations
      tags: [Session]
      summary: List organizations accessible to the signed-in user
      responses:
        "200":
          {
            description: Organizations,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/Organization" },
                      },
                  },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organization_id}/buildings:
    parameters:
      - {
          name: organization_id,
          in: path,
          required: true,
          schema: { $ref: "#/components/schemas/ID" },
        }
    get:
      operationId: listBuildings
      tags: [Buildings]
      summary: List buildings in an organization
      responses:
        "200":
          {
            description: Visible buildings,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/Building" },
                      },
                  },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createBuilding
      tags: [Buildings]
      summary: Create a building
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, timezone]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                timezone: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "201":
          {
            description: Created,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Building" } },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/buildings/{building_id}:
    parameters:
      - {
          name: building_id,
          in: path,
          required: true,
          schema: { $ref: "#/components/schemas/ID" },
        }
    get:
      operationId: getBuilding
      tags: [Buildings]
      summary: Read a building, its preferences, and its devices
      responses:
        "200":
          {
            description: Building,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Building" } },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/buildings/{building_id}/preferences:
    parameters:
      - {
          name: building_id,
          in: path,
          required: true,
          schema: { $ref: "#/components/schemas/ID" },
        }
    put:
      operationId: updatePreferences
      tags: [Buildings]
      summary: Save comfort preferences
      description: Use the building's current version as a quoted If-Match value, for example "1". A stale version returns 409.
      parameters:
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string, pattern: '^"[0-9]+"$' },
          }
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Preferences" } },
          }
      responses:
        "200":
          {
            description: Saved,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Building" } },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/buildings/{building_id}/enrollments:
    parameters:
      - {
          name: building_id,
          in: path,
          required: true,
          schema: { $ref: "#/components/schemas/ID" },
        }
    post:
      operationId: enrollDevice
      tags: [Buildings]
      summary: Claim a provisioned heat pump for a building
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [claim_code]
              properties:
                claim_code: { type: string, minLength: 20, maxLength: 128 }
      responses:
        "202":
          {
            description: Claimed; edge activation pending,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Device" } },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{device_id}:
    parameters:
      - { $ref: "#/components/parameters/DeviceID" }
    get:
      operationId: getDevice
      tags: [Devices]
      summary: Read device connectivity and latest telemetry
      responses:
        "200":
          {
            description: Device,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Device" } },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{device_id}/runs:
    parameters: [{ $ref: "#/components/parameters/DeviceID" }]
    get:
      operationId: listRuns
      tags: [Devices]
      responses:
        "200":
          description: Latest 100 retained simulation runs
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: "#/components/schemas/RunSummary" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{device_id}/history:
    parameters: [{ $ref: "#/components/parameters/DeviceID" }]
    get:
      operationId: getHistory
      tags: [Devices]
      summary: Bounded observed simulation history with explicit coverage
      parameters:
        - {
            name: run_id,
            in: query,
            schema: { $ref: "#/components/schemas/ID" },
          }
        - {
            name: day,
            in: query,
            description: Calendar day in the building timezone; use this or both from and to,
            schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' },
          }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - {
            name: bucket_minutes,
            in: query,
            schema: { type: integer, enum: [15, 60] },
          }
      responses:
        "200":
          description: Counter-based energy and known cost; complete cost is null across missing intervals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/History" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organization_id}/metrics:
    parameters: [{ $ref: "#/components/parameters/OrganizationID" }]
    get:
      operationId: getMetrics
      tags: [Organizations]
      responses:
        "200":
          description: Organization-scoped operational snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Metrics" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organization_id}/fleet:
    parameters: [{ $ref: "#/components/parameters/OrganizationID" }]
    get:
      operationId: getFleet
      tags: [Organizations]
      responses:
        "200":
          description: Organization operator view limited to 25 simulated devices
          content:
            application/json:
              schema:
                {
                  type: array,
                  maxItems: 25,
                  items: { $ref: "#/components/schemas/FleetDevice" },
                }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organization_id}/flexibility-events:
    parameters: [{ $ref: "#/components/parameters/OrganizationID" }]
    get:
      operationId: listFlexibilityEvents
      tags: [Organizations]
      responses:
        "200":
          description: Latest ten bounded simulated events
          content:
            application/json:
              schema:
                {
                  type: array,
                  maxItems: 10,
                  items: { $ref: "#/components/schemas/FlexibilityEvent" },
                }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createFlexibilityEvent
      tags: [Organizations]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [duration_sim_minutes]
              properties:
                duration_sim_minutes: { type: integer, minimum: 5, maximum: 60 }
      responses:
        "201":
          description: Per-device run windows and eligibility; control uses the common resolver
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlexibilityEvent" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organization_id}/flexibility-events/{event_id}:
    parameters:
      - { $ref: "#/components/parameters/OrganizationID" }
      - {
          name: event_id,
          in: path,
          required: true,
          schema: { $ref: "#/components/schemas/ID" },
        }
    get:
      operationId: getFlexibilityEvent
      tags: [Organizations]
      responses:
        "200":
          description: Covered interval energy and before/after reference change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlexibilityEvent" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: cancelFlexibilityEvent
      tags: [Organizations]
      responses:
        "204":
          { description: Event cancelled and prior delivery authority fenced }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{device_id}/replays:
    parameters: [{ $ref: "#/components/parameters/DeviceID" }]
    get:
      operationId: listReplays
      tags: [Devices]
      responses:
        "200":
          description: Latest five immutable observed-policy comparisons
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items: { $ref: "#/components/schemas/Replay" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createReplay
      tags: [Devices]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [run_id, from, to]
              properties:
                run_id: { $ref: "#/components/schemas/ID" }
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
      responses:
        "201":
          description: Model replay, with incomplete evidence and mismatch explicitly reported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Replay" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{device_id}/settings:
    parameters: [{ $ref: "#/components/parameters/DeviceID" }]
    get:
      operationId: getDeviceSettings
      tags: [Devices]
      responses:
        "200":
          description: Desired device policy with explicit capability and version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceSettings" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateDeviceSettings
      tags: [Devices]
      parameters:
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HeatingPreferences" }
      responses:
        "202":
          description: Policy persisted; equipment acknowledgement is separate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceSettings" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{device_id}/run:
    parameters: [{ $ref: "#/components/parameters/DeviceID" }]
    get:
      operationId: getRun
      tags: [Devices]
      summary: Read the current simulator run and last acknowledged administration operation
      responses:
        "200":
          description: Run state; pending operations have not yet converged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunState" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: changeRun
      tags: [Devices]
      summary: Pause, resume, change pacing or reset simulated equipment through the integration path
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, rate, model]
              properties:
                action: { type: string, enum: [pause, resume, rate, reset] }
                rate: { type: integer, enum: [1, 10, 60] }
                model: { type: string, enum: [heating, heating-dhw] }
      responses:
        "202":
          description: Durable operation queued; poll until acknowledged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunState" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{device_id}/series:
    parameters:
      - { $ref: "#/components/parameters/DeviceID" }
    get:
      operationId: getSeries
      tags: [Devices]
      summary: Read the latest 600 samples in the current simulation run
      responses:
        "200":
          {
            description: Latest 600 samples of the current simulation run,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/Sample" },
                      },
                  },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{device_id}/commands:
    parameters:
      - { $ref: "#/components/parameters/DeviceID" }
    get:
      operationId: listCommands
      parameters:
        - {
            name: run_id,
            in: query,
            schema: { $ref: "#/components/schemas/ID" },
          }
        - {
            name: before_sequence,
            in: query,
            description: Exclusive command sequence cursor; requires run_id,
            schema: { type: integer, minimum: 1, maximum: 4294967295 },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      tags: [Devices]
      summary: Read the latest 50 commands and their execution evidence
      responses:
        "200":
          {
            description: Bounded command history; default 50 and optional run-scoped sequence pagination,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/Command" },
                      },
                  },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{device_id}/optimization:
    parameters: [{ $ref: "#/components/parameters/DeviceID" }]
    get:
      operationId: getOptimization
      tags: [Devices]
      summary: Read automation policy, integration route and latest model plan
      responses:
        "200":
          description: Desired policy; reported configuration and telemetry remain execution evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptimizationState" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: setOptimization
      tags: [Devices]
      summary: Load a packaged deterministic weather/price scenario and enable or disable optimization
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, scenario]
              properties:
                enabled: { type: boolean }
                scenario: { $ref: "#/components/schemas/ScenarioName" }
      responses:
        "202":
          description: Policy saved; manual override keeps precedence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptimizationState" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{device_id}/comparisons:
    parameters: [{ $ref: "#/components/parameters/DeviceID" }]
    get:
      operationId: listComparisons
      tags: [Devices]
      summary: Latest five immutable model comparisons, never presented as measured savings
      responses:
        "200":
          description: Model reports
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: "#/components/schemas/Comparison" },
                }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createComparison
      tags: [Devices]
      summary: Compare baseline and candidate for 24 hours plus six recovery hours
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scenario, start]
              properties:
                scenario: { $ref: "#/components/schemas/ScenarioName" }
                start: { type: string, format: date-time }
      responses:
        "201":
          description: Immutable model report using disclosed equivalent initial conditions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comparison" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{device_id}/comparisons/{comparison_id}/artifact:
    parameters:
      - { $ref: "#/components/parameters/DeviceID" }
      - {
          name: comparison_id,
          in: path,
          required: true,
          schema: { $ref: "#/components/schemas/ID" },
        }
    post:
      operationId: exportComparison
      tags: [Devices]
      summary: Idempotently export a comparison to local Floci S3
      responses:
        "201":
          description: Stored artifact, retrieved through the authorized cloud API
          content:
            application/json:
              schema:
                type: object
                required: [download_url]
                properties: { download_url: { type: string } }
        default: { $ref: "#/components/responses/Problem" }
    get:
      operationId: downloadComparison
      tags: [Devices]
      summary: Read an exported comparison after checking device ownership
      responses:
        "200":
          description: S3 report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comparison" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{device_id}/overrides:
    parameters:
      - { $ref: "#/components/parameters/DeviceID" }
    post:
      operationId: createOverride
      tags: [Devices]
      summary: Set a temporary room-temperature override
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [room_target_c, duration_sim_minutes]
              properties:
                room_target_c:
                  { type: number, format: double, minimum: 16, maximum: 26 }
                duration_sim_minutes:
                  { type: integer, minimum: 5, maximum: 120 }
      responses:
        "202":
          {
            description: Intent persisted; application pending,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Command" } },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{device_id}/override:
    parameters:
      - { $ref: "#/components/parameters/DeviceID" }
    delete:
      operationId: cancelOverride
      tags: [Devices]
      summary: Cancel an override and return to baseline control
      responses:
        "204": { description: Override cancelled; baseline resolution pending }
        default: { $ref: "#/components/responses/Problem" }
  /edge/v1/enroll:
    post:
      operationId: activateEdge
      tags: [Edge]
      summary: Activate a claimed device and establish its MQTT credential
      security:
        - bootstrap: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_id, attempt_id, mqtt_password]
              properties:
                device_id: { $ref: "#/components/schemas/ID" }
                attempt_id: { $ref: "#/components/schemas/ID" }
                mqtt_password:
                  {
                    type: string,
                    format: password,
                    minLength: 32,
                    maxLength: 128,
                  }
      responses:
        "200":
          description: Activated
          content:
            application/json:
              schema:
                type: object
                required: [organization_id, device_id, run_id, run_epoch]
                properties:
                  organization_id: { $ref: "#/components/schemas/ID" }
                  device_id: { $ref: "#/components/schemas/ID" }
                  run_id: { $ref: "#/components/schemas/ID" }
                  run_epoch: { type: integer, minimum: 1 }
        default: { $ref: "#/components/responses/Problem" }
  /health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: Check that the HTTP process is alive
      security: []
      responses:
        "204": { description: Process is serving requests }
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Check PostgreSQL and MQTT readiness
      security: []
      responses:
        "204": { description: Required dependencies are ready }
        "503": { description: A required dependency is unavailable }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: thermora_session
      description: Sign in through the dashboard or the login operation. The browser manages this HttpOnly cookie; do not enter it manually.
    bootstrap:
      type: http
      scheme: bearer
      description: Provisioned one-device bootstrap secret. Only for edge activation; never a user session credential.
  parameters:
    OrganizationID:
      name: organization_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ID" }
    DeviceID:
      {
        name: device_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/ID" },
      }
    IdempotencyKey:
      name: Idempotency-Key
      description: Use a unique key of 16–128 characters per new operation; reuse it only when retrying the identical request. A UUID is suitable.
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
  responses:
    Problem:
      description: Safe, structured error
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/Problem" } },
        }
  schemas:
    RunSummary:
      type: object
      required: [run_id, epoch, model, created_at_wall]
      properties:
        run_id: { $ref: "#/components/schemas/ID" }
        epoch: { type: integer }
        model: { type: string }
        created_at_wall: { type: string, format: date-time }
        finished_at_wall: { type: string, format: date-time }
        first_observed_at: { type: string, format: date-time }
        last_observed_at: { type: string, format: date-time }
    Metrics:
      type: object
      required:
        [
          sampled_at_wall,
          active_devices,
          fresh_devices,
          pending_deliveries,
          oldest_delivery_seconds,
          manufacturer_failures,
          rejected_commands,
          expired_commands,
          turnaround_samples,
          device_diagnostics,
        ]
      properties:
        sampled_at_wall: { type: string, format: date-time }
        active_devices: { type: integer }
        fresh_devices: { type: integer }
        pending_deliveries: { type: integer }
        oldest_delivery_seconds: { type: number, format: double }
        manufacturer_failures: { type: integer }
        rejected_commands: { type: integer }
        expired_commands: { type: integer }
        turnaround_samples: { type: integer }
        mean_application_seconds: { type: number, format: double }
        device_diagnostics:
          type: array
          maxItems: 25
          items:
            type: object
            required: [device_id]
            properties:
              device_id: { $ref: "#/components/schemas/ID" }
              telemetry_age_seconds: { type: number, format: double }
              credential_revocation_pending: { type: boolean }
              edge: { $ref: "#/components/schemas/Diagnostics" }
    Diagnostics:
      type: object
      x-go-type: protocol.Diagnostics
      x-go-type-import:
        { path: thermora.local/thermora/internal/protocol, name: protocol }
      required:
        [
          recorded_at_wall,
          buffered_batches,
          buffered_bytes,
          pending_events,
          journal_entries,
        ]
      properties:
        recorded_at_wall: { type: string, format: date-time }
        buffered_batches: { type: integer, minimum: 0, maximum: 1000000 }
        buffered_bytes: { type: integer, minimum: 0, maximum: 134217728 }
        pending_events: { type: integer, minimum: 0, maximum: 10000 }
        journal_entries: { type: integer, minimum: 0, maximum: 10000 }
    FleetDevice:
      type: object
      required: [device, building_name, eligibility]
      properties:
        device: { $ref: "#/components/schemas/Device" }
        building_name: { type: string }
        eligibility: { type: string }
    FlexibilityEvent:
      type: object
      required:
        [
          id,
          organization_id,
          status,
          created_at_wall,
          expires_at_wall,
          duration_sim_minutes,
          participants,
        ]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        organization_id: { $ref: "#/components/schemas/ID" }
        status:
          { type: string, enum: [active, completed, cancelled, timed_out] }
        created_at_wall: { type: string, format: date-time }
        expires_at_wall: { type: string, format: date-time }
        duration_sim_minutes: { type: integer }
        participants:
          {
            type: array,
            maxItems: 25,
            items: { $ref: "#/components/schemas/FlexParticipant" },
          }
    FlexParticipant:
      type: object
      required:
        [
          device_id,
          run_id,
          start,
          end,
          status,
          reason,
          covered_seconds,
          command_counts,
        ]
      properties:
        device_id: { $ref: "#/components/schemas/ID" }
        run_id: { $ref: "#/components/schemas/ID" }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        status: { type: string, enum: [eligible, excluded, completed] }
        reason: { type: string }
        command_counts:
          type: array
          description: Current command states associated with this event; empty on list summaries.
          items:
            type: object
            required: [stage, count]
            properties:
              stage: { type: string }
              count: { type: integer }
        covered_seconds: { type: number, format: double }
        covered_energy_kwh: { type: number, format: double }
        reference_power_kw:
          {
            type: number,
            format: double,
            description: One pre-event reading not a causal baseline,
          }
        observed_mean_kw: { type: number, format: double }
        observed_change_kw:
          {
            type: number,
            format: double,
            description: Reference minus interval mean not verified demand response,
          }
    Replay:
      type: object
      x-go-type: reporting.Replay
      x-go-type-import:
        { path: thermora.local/thermora/internal/reporting, name: reporting }
      required:
        [
          id,
          device_id,
          run_id,
          created_at_wall,
          provenance,
          input_hash,
          start,
          end,
          recovery_end,
          ready,
          comparable,
          reason,
          observed_energy_kwh,
          observed_cost_eur,
          model_energy_error_kwh,
          savings_eur,
          baseline,
          replayed,
        ]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        device_id: { $ref: "#/components/schemas/ID" }
        run_id: { $ref: "#/components/schemas/ID" }
        created_at_wall: { type: string, format: date-time }
        provenance: { type: string, enum: [observed_policy_replay] }
        input_hash: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        recovery_end: { type: string, format: date-time }
        ready:
          {
            type: boolean,
            description: Replayed endpoint and energy agree with observed values within documented tolerances,
          }
        comparable: { type: boolean }
        reason: { type: string }
        observed_energy_kwh: { type: number }
        observed_cost_eur: { type: [number, "null"] }
        model_energy_error_kwh: { type: [number, "null"] }
        savings_eur: { type: [number, "null"] }
        baseline:
          anyOf:
            [{ $ref: "#/components/schemas/ModelOutcome" }, { type: "null" }]
        replayed:
          anyOf:
            [{ $ref: "#/components/schemas/ModelOutcome" }, { type: "null" }]
    History:
      type: object
      x-go-type: reporting.History
      x-go-type-import:
        { path: thermora.local/thermora/internal/reporting, name: reporting }
      required:
        [
          run_id,
          start,
          end,
          timezone,
          provenance,
          covered_seconds,
          priced_seconds,
          gap_seconds,
          covered_energy_kwh,
          known_cost_eur,
          cost_eur,
          comfort_degree_hours,
          buckets,
        ]
      properties:
        run_id: { $ref: "#/components/schemas/ID" }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        timezone: { type: string }
        provenance: { type: string, enum: [observed_in_simulation] }
        covered_seconds: { type: number }
        priced_seconds: { type: number }
        gap_seconds: { type: number }
        covered_energy_kwh: { type: number }
        known_cost_eur: { type: number }
        cost_eur: { type: [number, "null"] }
        comfort_degree_hours: { type: number }
        buckets:
          type: array
          maxItems: 672
          items:
            type: object
            required:
              [
                start,
                end,
                covered_seconds,
                priced_seconds,
                covered_energy_kwh,
                known_cost_eur,
                cost_eur,
                indoor_mean_c,
                last_room_target_c,
                last_supply_setpoint_c,
                comfort_degree_hours,
              ]
            properties:
              start: { type: string, format: date-time }
              end: { type: string, format: date-time }
              covered_seconds: { type: number }
              priced_seconds: { type: number }
              covered_energy_kwh: { type: number }
              known_cost_eur: { type: number }
              cost_eur: { type: [number, "null"] }
              indoor_mean_c: { type: [number, "null"] }
              last_room_target_c: { type: [number, "null"] }
              last_supply_setpoint_c: { type: [number, "null"] }
              comfort_degree_hours: { type: number }
    HotWaterThresholds:
      type: object
      additionalProperties: false
      required: [start_c, stop_c]
      properties:
        start_c: { type: number, minimum: 40, maximum: 52 }
        stop_c: { type: number, minimum: 43, maximum: 55 }
    HeatingPreferences:
      type: object
      additionalProperties: false
      required: [preset, flexibility_opt_in]
      properties:
        preset: { type: string, enum: [comfort, balanced, maximum-savings] }
        flexibility_opt_in: { type: boolean }
        hot_water: { $ref: "#/components/schemas/HotWaterThresholds" }
    DeviceSettings:
      type: object
      required: [version, model, preferences]
      properties:
        version: { type: integer, minimum: 1 }
        model: { type: string, enum: [heating, heating-dhw] }
        preferences: { $ref: "#/components/schemas/HeatingPreferences" }
    HotWaterSample:
      type: object
      x-go-type: protocol.HotWaterSample
      x-go-type-import:
        { path: thermora.local/thermora/internal/protocol, name: protocol }
      required: [temperature_c, start_c, stop_c, heating, electrical_energy_wh]
      properties:
        temperature_c: { type: number, minimum: 0, maximum: 90 }
        start_c: { type: number, minimum: 40, maximum: 52 }
        stop_c: { type: number, minimum: 43, maximum: 55 }
        heating: { type: boolean }
        electrical_energy_wh: { type: integer, minimum: 0, maximum: 4294967295 }
    RunState:
      type: object
      required: [run_id, epoch, paused, rate, model, status]
      properties:
        run_id: { $ref: "#/components/schemas/ID" }
        epoch: { type: integer }
        paused: { type: boolean }
        rate: { type: integer, enum: [1, 10, 60] }
        model: { type: string, enum: [heating, heating-dhw] }
        status: { type: string, enum: [ready, pending] }
        operation_id: { $ref: "#/components/schemas/ID" }
        action: { type: string }
    ScenarioName:
      type: string
      enum: [winter, negative-price, missing-price, missing-forecast]
    OptimizationState:
      type: object
      required:
        [
          enabled,
          scenario,
          tariff,
          integration_route,
          manufacturer_status,
          artifacts_enabled,
        ]
      properties:
        enabled: { type: boolean }
        scenario: { type: string }
        tariff: { type: string, enum: [fixed, variable] }
        integration_route: { type: string, enum: [edge, manufacturer] }
        manufacturer_status:
          {
            type: string,
            enum:
              [
                not_applicable,
                connected,
                authentication_required,
                disconnected,
              ],
          }
        artifacts_enabled: { type: boolean }
        plan: { $ref: "#/components/schemas/OptimizationPlan" }
    Comparison:
      type: object
      required: [id, device_id, created_at_wall, plan]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        device_id: { $ref: "#/components/schemas/ID" }
        created_at_wall: { type: string, format: date-time }
        plan: { $ref: "#/components/schemas/OptimizationPlan" }
    OptimizationPlan:
      type: object
      x-go-type: optimization.Plan
      x-go-type-import:
        {
          path: thermora.local/thermora/internal/optimization,
          name: optimization,
        }
      required:
        [
          scenario,
          tariff,
          input_hash,
          model_version,
          controller_version,
          provenance,
          start,
          end,
          recovery_end,
          initial_indoor_c,
          initial_supply_c,
          comfort,
          adopted,
          reason_code,
          comparable,
          savings_eur,
          baseline,
          optimized,
          intervals,
          trace,
        ]
      properties:
        scenario: { type: string }
        tariff: { type: string }
        input_hash: { type: string }
        model_version: { type: string }
        controller_version: { type: string }
        provenance: { type: string, enum: [modelled_comparison] }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        recovery_end: { type: string, format: date-time }
        initial_indoor_c: { type: number }
        initial_supply_c: { type: number }
        preset: { type: string }
        initial_buffer_c: { type: number }
        initial_hot_water_c: { type: number }
        comfort:
          type: object
          required: [target_c, min_c, max_c]
          properties:
            {
              target_c: { type: number },
              min_c: { type: number },
              max_c: { type: number },
            }
        adopted: { type: boolean }
        reason_code: { type: string }
        comparable: { type: boolean }
        savings_eur: { type: [number, "null"] }
        comparison_reason: { type: string }
        baseline: { $ref: "#/components/schemas/ModelOutcome" }
        optimized: { $ref: "#/components/schemas/ModelOutcome" }
        intervals:
          type: array
          maxItems: 96
          items:
            type: object
            required:
              [
                start,
                end,
                price_eur_per_kwh,
                forecast_outdoor_c,
                room_target_c,
                reason_code,
              ]
            properties:
              start: { type: string, format: date-time }
              end: { type: string, format: date-time }
              price_eur_per_kwh: { type: [number, "null"] }
              forecast_outdoor_c: { type: [number, "null"] }
              room_target_c: { type: number }
              reason_code: { type: string }
        trace:
          type: array
          maxItems: 120
          items:
            type: object
            required:
              [
                at,
                baseline_indoor_c,
                optimized_indoor_c,
                baseline_energy_kwh,
                optimized_energy_kwh,
              ]
            properties:
              at: { type: string, format: date-time }
              baseline_indoor_c: { type: number }
              optimized_indoor_c: { type: number }
              baseline_energy_kwh: { type: number }
              optimized_energy_kwh: { type: number }
    ModelOutcome:
      type: object
      required:
        [
          energy_kwh,
          cost_eur,
          comfort_degree_hours,
          terminal_indoor_c,
          terminal_supply_c,
        ]
      properties:
        energy_kwh: { type: number }
        cost_eur: { type: [number, "null"] }
        comfort_degree_hours: { type: number }
        terminal_indoor_c: { type: number }
        terminal_supply_c: { type: number }
        terminal_buffer_c: { type: number }
        terminal_hot_water_c: { type: number }
        terminal_dhw_heating: { type: boolean }
        terminal_compressor_on: { type: boolean }
        terminal_dwell_remaining_sim_seconds: { type: integer, minimum: 0 }
        horizon_energy_kwh: { type: number }
        horizon_cost_eur: { type: [number, "null"] }
    ManufacturerConnection:
      type: object
      required: [id, manufacturer_id, status, created_at_wall]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        manufacturer_id: { type: string, enum: [demo] }
        status:
          {
            type: string,
            enum: [connected, authentication_required, disconnected],
          }
        created_at_wall: { type: string, format: date-time }
    BuildingProfile:
      type: object
      additionalProperties: false
      required:
        [floor_area_m2, country_code, address, postal_code, city, tariff_type]
      properties:
        floor_area_m2: { type: number, minimum: 1, maximum: 10000 }
        country_code: { type: string, pattern: "^[A-Z]{2}$" }
        address: { type: string, minLength: 1, maxLength: 200 }
        postal_code: { type: string, minLength: 1, maxLength: 20 }
        city: { type: string, minLength: 1, maxLength: 100 }
        tariff_type: { type: string, enum: [fixed, variable] }
    CloudEnrollment:
      type: object
      additionalProperties: false
      required:
        [
          connection_id,
          manufacturer_device_id,
          access_code,
          building_name,
          timezone,
          profile,
          consent_version,
          consent_accepted,
        ]
      properties:
        connection_id: { $ref: "#/components/schemas/ID" }
        manufacturer_device_id: { type: string, minLength: 1, maxLength: 100 }
        access_code:
          { type: string, minLength: 16, maxLength: 128, writeOnly: true }
        building_name: { type: string, minLength: 1, maxLength: 100 }
        timezone: { type: string, minLength: 1, maxLength: 100 }
        profile: { $ref: "#/components/schemas/BuildingProfile" }
        consent_version: { type: string, enum: [local-demo-2026-09] }
        consent_accepted: { type: boolean }
    ID:
      {
        type: string,
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$",
      }
    Problem:
      type: object
      required: [type, title, status, code, detail, request_id]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        request_id: { type: string }
    Session:
      type: object
      required: [user_id, login, organizations]
      properties:
        user_id: { $ref: "#/components/schemas/ID" }
        login: { type: string }
        organizations:
          { type: array, items: { $ref: "#/components/schemas/Organization" } }
    Organization:
      type: object
      required: [id, name, role]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        name: { type: string }
        role: { type: string, enum: [owner, operator] }
    Preferences:
      type: object
      additionalProperties: false
      required: [timezone, comfort_target_c, comfort_min_c, comfort_max_c]
      properties:
        timezone: { type: string, minLength: 1, maxLength: 64 }
        comfort_target_c:
          { type: number, format: double, minimum: 16, maximum: 26 }
        comfort_min_c:
          { type: number, format: double, minimum: 16, maximum: 26 }
        comfort_max_c:
          { type: number, format: double, minimum: 16, maximum: 26 }
    Building:
      type: object
      required: [id, organization_id, name, version, preferences, devices]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        organization_id: { $ref: "#/components/schemas/ID" }
        name: { type: string }
        version: { type: integer }
        preferences: { $ref: "#/components/schemas/Preferences" }
        devices: { type: array, items: { $ref: "#/components/schemas/Device" } }
    Device:
      type: object
      required:
        [
          id,
          building_id,
          run_id,
          name,
          enrollment,
          connectivity,
          desired_version,
          reported_version,
          generation,
          origin,
        ]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        building_id: { $ref: "#/components/schemas/ID" }
        run_id: { $ref: "#/components/schemas/ID" }
        name: { type: string }
        enrollment:
          { type: string, enum: [claimed, activating, active, revoked] }
        connectivity: { type: string, enum: [waiting, online, stale, offline] }
        desired_version: { type: integer }
        reported_version: { type: integer }
        generation: { type: integer }
        origin: { type: string, enum: [simulation] }
        control_connected: { type: boolean }
        connection_id: { $ref: "#/components/schemas/ID" }
        last_received_at: { type: string, format: date-time }
        latest: { $ref: "#/components/schemas/Sample" }
    Sample:
      type: object
      required:
        [
          sample_seq,
          sim_elapsed_seconds,
          observed_at,
          recorded_at_wall,
          indoor_temperature_c,
          outdoor_temperature_c,
          supply_temperature_c,
          room_target_c,
          supply_setpoint_c,
          electrical_power_w,
          thermal_power_w,
          electrical_energy_wh,
          compressor_state,
          control_mode,
          alarm_codes,
          applied_command_seq,
          reported_config_version,
          quality_flags,
        ]
      properties:
        buffer_temperature_c:
          { type: number, format: double, minimum: 0, maximum: 90 }
        hot_water: { $ref: "#/components/schemas/HotWaterSample" }
        compressor_on: { type: boolean }
        last_switch_sim_seconds:
          { type: integer, minimum: 0, maximum: 4294967295 }
        thermal_energy_wh: { type: integer, minimum: 0, maximum: 4294967295 }
        sample_seq: { type: integer, minimum: 1, maximum: 4294967295 }
        sim_elapsed_seconds: { type: integer, minimum: 0, maximum: 4294967295 }
        observed_at: { type: string, format: date-time }
        recorded_at_wall: { type: string, format: date-time }
        indoor_temperature_c:
          { type: number, format: double, minimum: -40, maximum: 80 }
        outdoor_temperature_c:
          { type: number, format: double, minimum: -60, maximum: 60 }
        supply_temperature_c:
          { type: number, format: double, minimum: -40, maximum: 90 }
        room_target_c:
          { type: number, format: double, minimum: 16, maximum: 26 }
        supply_setpoint_c:
          { type: number, format: double, minimum: 25, maximum: 50 }
        electrical_power_w: { type: integer, minimum: 0, maximum: 10000 }
        thermal_power_w: { type: integer, minimum: 0, maximum: 50000 }
        electrical_energy_wh: { type: integer, minimum: 0, maximum: 4294967295 }
        compressor_state: { type: string, enum: [off, running, dwell, fault] }
        control_mode: { type: string, enum: [baseline, remote] }
        alarm_codes:
          {
            type: array,
            maxItems: 16,
            items: { type: string, minLength: 1, maxLength: 64 },
          }
        applied_command_seq: { type: integer, minimum: 0, maximum: 4294967295 }
        reported_config_version:
          { type: integer, minimum: 0, maximum: 4294967295 }
        quality_flags:
          {
            type: array,
            maxItems: 7,
            items:
              {
                type: string,
                enum:
                  [
                    sensor_fault,
                    out_of_range,
                    missing,
                    clock_uncertain,
                    buffered,
                    counter_reset,
                    gap_before,
                  ],
              },
          }
    Command:
      type: object
      required:
        [
          id,
          sequence,
          stage,
          reason_code,
          room_target_c,
          supply_setpoint_c,
          mode,
          issued_at_wall,
          expires_at_wall,
          valid_until,
          events,
        ]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        sequence: { type: integer }
        stage:
          {
            type: string,
            enum:
              [
                persisted,
                published,
                received,
                accepted,
                applied,
                confirmed,
                rejected,
                expired,
                superseded,
              ],
          }
        reason_code: { type: string }
        room_target_c: { type: number, format: double }
        supply_setpoint_c: { type: number, format: double }
        mode: { type: string }
        issued_at_wall: { type: string, format: date-time }
        expires_at_wall: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        events:
          type: array
          items:
            type: object
            required: [stage, occurred_at_wall, reason_code]
            properties:
              stage: { type: string }
              occurred_at_wall: { type: string, format: date-time }
              reason_code: { type: string }
